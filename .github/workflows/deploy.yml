name: CP Agenda Pro - Deploy Automático (VPS)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Frontend (Vite + TypeScript)
      run: |
        npm install
        npm run build

    - name: Configurar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2

    - name: Instalar dependências PHP completas (para PHPStan)
      working-directory: ./backend
      run: composer install --optimize-autoloader --ignore-platform-reqs --no-interaction

    - name: Análise Estática (PHPStan — bloqueia deploy em caso de erro de tipagem)
      working-directory: ./backend
      run: ./vendor/bin/phpstan analyse --error-format=github --memory-limit=-1

    - name: Gerar .env de produção a partir dos GitHub Secrets
      env:
        SECRET_DB_HOST: ${{ secrets.DB_HOST }}
        SECRET_DB_PORT: ${{ secrets.DB_PORT }}
        SECRET_DB_NAME: ${{ secrets.DB_NAME }}
        SECRET_DB_USER: ${{ secrets.DB_USER }}
        SECRET_DB_PASS: ${{ secrets.DB_PASS }}
        SECRET_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        SECRET_TELEGRAM_MONITOR: ${{ secrets.TELEGRAM_MONITOR_TOKEN }}
        SECRET_TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
        SECRET_TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        SECRET_SMTP_USER: ${{ secrets.SMTP_USER }}
        SECRET_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SECRET_SMTP_FROM: ${{ secrets.SMTP_FROM }}
        SECRET_SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      run: |
        echo "DB_HOST=${SECRET_DB_HOST}" > backend/.env
        echo "DB_PORT=${SECRET_DB_PORT}" >> backend/.env
        echo "DB_NAME=${SECRET_DB_NAME}" >> backend/.env
        echo "DB_USER=${SECRET_DB_USER}" >> backend/.env
        echo "DB_PASS=${SECRET_DB_PASS}" >> backend/.env
        echo "DB_CHARSET=utf8mb4" >> backend/.env
        echo "API_VERSION=1.0.0" >> backend/.env
        echo "DEBUG_MODE=false" >> backend/.env
        echo "TELEGRAM_BOT_TOKEN=${SECRET_TELEGRAM}" >> backend/.env
        echo "TELEGRAM_MONITOR_TOKEN=${SECRET_TELEGRAM_MONITOR}" >> backend/.env
        echo "TELEGRAM_ERROR_CHAT_ID=${SECRET_TELEGRAM_ERROR_CHAT_ID}" >> backend/.env
        echo "TELEGRAM_ADMIN_CHAT_ID=${SECRET_TELEGRAM_ADMIN_CHAT_ID}" >> backend/.env
        echo "SMTP_HOST=smtp.hostinger.com" >> backend/.env
        echo "SMTP_PORT=465" >> backend/.env
        echo "SMTP_USER=${SECRET_SMTP_USER}" >> backend/.env
        echo "SMTP_PASSWORD=${SECRET_SMTP_PASSWORD}" >> backend/.env
        echo "SMTP_FROM=${SECRET_SMTP_FROM}" >> backend/.env
        echo "SMTP_FROM_NAME=${SECRET_SMTP_FROM_NAME}" >> backend/.env
        echo ".env gerado com $(wc -l < backend/.env) linhas"

    - name: Configurar chave SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

    - name: Verificar identidade do projeto na VPS
      run: |
        ACTUAL=$(ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "cat /var/www/cpagendapro/.project-id 2>/dev/null || echo MISSING")
        if [ "$ACTUAL" != "cpagenda-jp-v1" ]; then
          echo "ERRO: .project-id incorreto ('$ACTUAL'). Deploy cancelado."
          exit 1
        fi
        echo "Identidade verificada: $ACTUAL"

    - name: Enviar frontend via rsync
      run: |
        rsync -az --delete \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
          dist/ \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/cpagendapro/public/

    - name: Enviar backend via rsync
      run: |
        rsync -az \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
          --exclude='vendor/' \
          backend/api/ backend/database/ backend/migrate.php backend/.env backend/composer.json backend/composer.lock \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/cpagendapro/backend/

    - name: Finalizar deploy via SSH
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
        set -e

        # Corrigir owner para que PHP-FPM (www-data) leia o .env
        sudo chown -R deploy:www-data /var/www/cpagendapro/backend
        chmod 640 /var/www/cpagendapro/backend/.env

        # Instalar dependências PHP na VPS (sem dev)
        cd /var/www/cpagendapro/backend
        composer install --no-dev --optimize-autoloader --no-interaction 2>&1 | tail -5

        # Migrations (idempotente — seguro rodar em todo deploy)
        php /var/www/cpagendapro/backend/migrate.php

        # Backup, permissões do public e reload PHP-FPM
        /home/deploy/bin/safe-deploy-jp.sh

        echo "Deploy concluído com sucesso em $(date)"
        ENDSSH
